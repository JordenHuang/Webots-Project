#VRML_SIM R2023b utf8

PROTO box_large [
  field  SFVec3f     translation      0 0 0
  field  SFRotation  rotation         0 0 1 0
  field  SFString    name             "box_large"
  field  SFColor     color            0.35 0.35 0.4
  field  SFString    contactMaterial  "default"
  field  SFNode      physics          Physics { density 2700 }  # Default to aluminium density.
]

{
  Solid {
    translation IS translation
    rotation IS rotation
    children [
      DEF BOX_LARGE_SHAPE Shape {
        appearance PBRAppearance {
          baseColor IS color
          roughness 0.2
          metalness 0
        }
        geometry Box {
          size 0.12 0.12 0.12
        }
      }
    ]
    name IS name
    boundingObject USE BOX_LARGE_SHAPE
    # physics Physics {
    #   density -1
    #   mass 0.5
    # }
    physics IS physics
    contactMaterial IS contactMaterial
  }
}